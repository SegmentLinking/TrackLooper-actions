name: Runs SCRAM static checks

on:
  workflow_call:
    inputs:
      pr-number:
        description: PR number
        required: true
        type: number
      required-prs:
        description: Comma-separated list of required PR numbers that must be merged before checks are run
        required: false
        type: string
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          repository: SegmentLinking/cmssw
          ref: refs/pull/${{ inputs.number }}/head
      - name: Get commit SHA
        run: |
          sha=$(git rev-parse HEAD)
          echo "COMMIT_SHA=$sha" >> $GITHUB_ENV
      - name: Create App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          skip-token-revoke: true
      - name: Create in progress check
        uses: LouisBrunner/checks-action@v2.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          sha: ${{ env.COMMIT_SHA }}
          name: Static Checks
          status: in_progress
          details_url: ${{ github.server_url }}/SegmentLinking/cmssw/actions/runs/${{ github.run_id }}
          output: |
            {"title": "This check has started...", "summary": "The logs can be found [here](${{ github.server_url }}/SegmentLinking/cmssw/actions/runs/${{ github.run_id }})."}
      - name: Merge required PRs
        if: ${{ inputs.required-prs != '' }}
        run: |
          IFS=',' read -ra PRS <<< "${{ inputs.required-prs }}"
          for pr in "${PRS[@]}"; do
            echo "Merging required PR #$pr"
            git merge refs/pull/${pr}/head
          done
      - name: Run static checks with SCRAM
        timeout-minutes: 100
        uses: ../checks@use_reusable_workflows
        with:
          pr-number: ${{ inputs.pr-number }}
      - name: Create App Token
        if: always()
        uses: actions/create-github-app-token@v1
        id: app-token-end
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
      - name: Create completed check
        uses: LouisBrunner/checks-action@v2.0.0
        if: always()
        with:
          token: ${{ steps.app-token-end.outputs.token }}
          sha: ${{ env.COMMIT_SHA }}
          name: Static Checks
          conclusion: ${{ job.status }}
          details_url: ${{ github.server_url }}/SegmentLinking/cmssw/actions/runs/${{ github.run_id }}
          output: |
            {"title": "Status: ${{ job.status }}", "summary": "The logs can be found [here](${{ github.server_url }}/SegmentLinking/cmssw/actions/runs/${{ github.run_id }})."}