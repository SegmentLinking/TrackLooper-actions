name: Standalone Testing

on:
  workflow_call:
    # Seems like inputs other than `string` don't work well here
    inputs:
      pr-number:
        description: PR number (if 0, use master and skip comparisons)
        required: true
        type: string
      required-prs:
        description: Comma-separated list of required PR numbers that must be merged before checks are run
        required: false
        type: string
      runs-on:
        description: Runner where to run the workflow
        required: true
        type: string
      low-pt:
        description: Run the low pT setup
        required: false
        type: string
      sample:
        description: Sample to run on (ttbar or qcd, defaults to ttbar)
        required: false
        type: string
      release:
        description: CMSSW release to use
        required: false
        type: string
      packages:
        description: Comma-separated list of extra packages to add
        required: false
        type: string
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true
      deploy-private-key:
        required: true


jobs:
  maps:
    name: Generate module maps for ${{ inputs.pr-number != '0' && format('PR{0}', inputs.pr-number) || 'master' }}
    # Map generation only needs CPU, so it always runs on a hosted runner
    runs-on: ubuntu-latest
    concurrency:
      group: lst-standalone-maps-PR${{ inputs.pr-number }}-${{ inputs.runs-on }}${{ inputs.sample == 'qcd' && '-qcd' || '' }}${{ inputs.low-pt == 'true' && '-lowpt' || '' }}
      cancel-in-progress: true
    outputs:
      # Artifacts are shared by the whole run, which can call this workflow several times
      artifact-name: lst-maps-PR${{ inputs.pr-number }}-${{ inputs.runs-on }}${{ inputs.sample == 'qcd' && '-qcd' || '' }}${{ inputs.low-pt == 'true' && '-lowpt' || '' }}
      # The check is created here so that it shows up as soon as the workflow starts. The test job updates it
      check-id: ${{ steps.check.outputs.check_id }}
    steps:
      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          skip-token-revoke: true
      - name: Get commit SHA
        uses: actions/github-script@v9
        id: sha
        with:
          result-encoding: string
          script: |
            if ("${{ inputs.pr-number }}" === "0") {
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: "cmssw",
                branch: "master",
              });
              return branch.commit.sha;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: "cmssw",
              pull_number: "${{ inputs.pr-number }}",
            });
            return pullRequest.head.sha;
      - name: Create in progress check
        uses: LouisBrunner/checks-action@v3.1.0
        id: check
        with:
          token: ${{ steps.app-token.outputs.token }}
          sha: ${{ steps.sha.outputs.result }}
          name: Run Standalone ${{ inputs.sample == 'qcd' && 'QCD' || 'PU200' }}${{ inputs.runs-on == 'self-hosted' && ' (GPU)' || '' }}${{ inputs.low-pt == 'true' && ' (low pT setup)' || '' }}
          status: in_progress
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: |
            {"title": "Generating module maps...", "summary": "The logs can be found [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."}
      - name: Check out PR
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr-number != '0' && format('refs/pull/{0}/head', inputs.pr-number) || 'master' }}
          # Full history is needed to merge the branches, but blobs are only fetched when needed
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            RecoTracker/LSTGeometry
      - name: Generate or restore maps
        uses: SegmentLinking/TrackLooper-actions/standalone-maps@main
        with:
          pr-number: ${{ inputs.pr-number }}
          required-prs: ${{ inputs.required-prs }}
          low-pt: ${{ inputs.low-pt }}
          release: ${{ inputs.release }}
          artifact-name: lst-maps-PR${{ inputs.pr-number }}-${{ inputs.runs-on }}${{ inputs.sample == 'qcd' && '-qcd' || '' }}${{ inputs.low-pt == 'true' && '-lowpt' || '' }}
      # If this job is cancelled the test job is skipped, so the check has to be closed here
      - name: Create App Token
        if: cancelled() && steps.check.outputs.check_id != ''
        uses: actions/create-github-app-token@v3
        id: app-token-end
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
      - name: Create cancelled check
        if: cancelled() && steps.check.outputs.check_id != ''
        uses: LouisBrunner/checks-action@v3.1.0
        with:
          token: ${{ steps.app-token-end.outputs.token }}
          check_id: ${{ steps.check.outputs.check_id }}
          conclusion: cancelled
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: |
            {"title": "Status: cancelled", "summary": "The logs can be found [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."}

  test:
    name: Run standalone tests for ${{ inputs.pr-number != '0' && format('PR{0}', inputs.pr-number) || 'master' }}
    needs: maps
    # Still run if the maps job failed, so that the failure is reported in the check and PR comment
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    # One group per check, so re-running a check cancels the previous run of that same check
    concurrency:
      group: lst-standalone-PR${{ inputs.pr-number }}-${{ inputs.runs-on }}${{ inputs.sample == 'qcd' && '-qcd' || '' }}${{ inputs.low-pt == 'true' && '-lowpt' || '' }}
      cancel-in-progress: true
    steps:
      - name: Check out PR
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr-number != '0' && format('refs/pull/{0}/head', inputs.pr-number) || 'master' }}
          sparse-checkout: |
            RecoTracker/LST
            RecoTracker/LSTCore
      - name: Get commit SHA
        run: |
          sha=$(git rev-parse HEAD)
          echo "COMMIT_SHA=$sha" >> $GITHUB_ENV
      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          skip-token-revoke: true
      # Normally the check was already created by the maps job. Only create it here if that job failed early
      - name: Update in progress check
        uses: LouisBrunner/checks-action@v3.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          sha: ${{ env.COMMIT_SHA }}
          check_id: ${{ needs.maps.outputs.check-id }}
          name: ${{ needs.maps.outputs.check-id == '' && format('Run Standalone {0}{1}{2}', inputs.sample == 'qcd' && 'QCD' || 'PU200', inputs.runs-on == 'self-hosted' && ' (GPU)' || '', inputs.low-pt == 'true' && ' (low pT setup)' || '') || '' }}
          status: in_progress
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: |
            {"title": "Building and running...", "summary": "The logs can be found [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."}
      - name: Download maps
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.maps.outputs.artifact-name }}
          path: lst-maps
      - name: Build and run PR
        timeout-minutes: 60
        id: build-and-run
        uses: SegmentLinking/TrackLooper-actions/standalone@main
        with:
          pr-number: ${{ inputs.pr-number }}
          required-prs: ${{ inputs.required-prs }}
          runs-on: ${{ inputs.runs-on }}
          low-pt: ${{ inputs.low-pt }}
          sample: ${{ inputs.sample }}
          release: ${{ inputs.release }}
          packages: ${{ inputs.packages }}
          maps-dir: lst-maps
      - name: Upload plots to archival repo
        if: inputs.pr-number != '0'
        uses: SegmentLinking/TrackLooper-actions/upload-plots@main
        with:
          repo: ${{ steps.build-and-run.outputs.archive-repo }}
          branch: ${{ steps.build-and-run.outputs.archive-branch }}
          dir: ${{ steps.build-and-run.outputs.archive-dir }}
          ssh-private-key: ${{ secrets.deploy-private-key }}
      - name: Comment on PR
        if: inputs.pr-number != '0'
        uses: actions/github-script@v9
        env:
          COMMENT: ${{ steps.build-and-run.outputs.comment }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: '${{ inputs.pr-number }}',
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.COMMENT
            })
      - name: Comment on PR if job failed.
        if: failure() && inputs.pr-number != '0'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: '${{ inputs.pr-number }}',
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `There was a problem while building and running in standalone mode. The logs can be found [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
            })
      - name: Create App Token
        if: always()
        uses: actions/create-github-app-token@v3
        id: app-token-end
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
      - name: Create completed check
        uses: LouisBrunner/checks-action@v3.1.0
        if: always()
        with:
          token: ${{ steps.app-token-end.outputs.token }}
          sha: ${{ env.COMMIT_SHA }}
          check_id: ${{ needs.maps.outputs.check-id }}
          name: ${{ needs.maps.outputs.check-id == '' && format('Run Standalone {0}{1}{2}', inputs.sample == 'qcd' && 'QCD' || 'PU200', inputs.runs-on == 'self-hosted' && ' (GPU)' || '', inputs.low-pt == 'true' && ' (low pT setup)' || '') || '' }}
          conclusion: ${{ job.status }}
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: |
            {"title": "Status: ${{ job.status }}", "summary": "The logs can be found [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."}